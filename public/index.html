<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechShop - Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif; box-sizing:border-box; margin:0; padding:0;}
body{background:#0f1115; color:#e5e7eb; padding:30px;}
h1{font-size:28px; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
.badge{background:#1f2937; padding:10px 16px; border-radius:12px; display:inline-flex; align-items:center; gap:10px; margin-bottom:25px;}
.badge select{background:#111827; color:white; border:1px solid #374151; padding:8px 12px; border-radius:8px; font-weight:600;}
.card{background:#181a20; border:1px solid #262a33; border-radius:16px; padding:22px; margin-bottom:24px; box-shadow:0 10px 30px rgba(0,0,0,0.3);}
.card h2{font-size:18px; margin-bottom:15px; color:#fff;}
table{width:100%; border-collapse:collapse;}
th{color:#9ca3af; font-size:12px; text-transform:uppercase; letter-spacing:1px; padding:12px 10px; border-bottom:1px solid #262a33; text-align:left;}
td{padding:14px 10px; border-bottom:1px solid #1f242f; font-size:14px;}
tr:hover td{background:#1e212a;}
.status{padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600;}
.status.Concluído{background:#052e1f; color:#34d399; border:1px solid #065f46;}
.status.Pendente{background:#2a1f05; color:#fbbf24; border:1px solid #92400e;}
input[type=number]{background:#0f1115; border:1px solid #374151; color:white; padding:8px 10px; border-radius:8px; width:80px; text-align:center;}
.btn{padding:8px 14px; border-radius:10px; border:none; cursor:pointer; font-weight:600; transition:.2s;}
.btn-primary{background:#3b82f6; color:white;} .btn-primary:hover{background:#2563eb; transform:translateY(-1px);}
.btn-ghost{background:#262a33; color:#d1d5db;} .btn-ghost:hover{background:#2f3441;}

/* POPUP */
#overlay{position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:9999; animation:fadeIn .2s ease;}
#popup-box{width:90%; max-width:380px; padding:28px; border-radius:20px; text-align:center; transform:scale(.9); animation:popIn .3s ease forwards; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
#popup-box.erro{background:linear-gradient(135deg,#7f1d1d,#dc2626); border:1px solid #ef4444;}
#popup-box.sucesso{background:linear-gradient(135deg,#064e3b,#059669); border:1px solid #10b981;}
#popup-box .icon{font-size:48px; margin-bottom:12px; display:block;}
#popup-box h3{font-size:20px; margin-bottom:8px;}
#popup-box p{font-size:14px; opacity:.9; line-height:1.5;}
#popup-close{margin-top:18px; background:white; color:black; padding:10px 22px; border-radius:10px; border:none; font-weight:700; cursor:pointer;}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes popIn{to{transform:scale(1)}}
</style>
</head>
<body>

<h1>⚡ TechShop OS</h1>

<div class="badge">
  <span>👤 Acesso:</span>
  <select id="nivelAcesso">
    <option value="Client">Cliente - Só visualiza</option>
    <option value="Admin">Administrador - Acesso total</option>
  </select>
</div>

<div class="card">
  <h2>📊 Relatório de Vendas</h2>
  <table id="tabelaVendas"><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Status</th></tr></thead><tbody><tr><td colspan="4">Carregando...</td></tr></tbody></table>
</div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h2>📦 Estoque Técnico</h2>
    <button class="btn btn-ghost" onclick="carregarEstoque()">↻ Atualizar</button>
  </div>
  <table id="tabelaEstoque"><thead><tr><th>Produto</th><th>Estoque</th><th>Vendido</th><th>Ação</th></tr></thead><tbody><tr><td colspan="4">Carregando...</td></tr></tbody></table>
</div>

<div id="overlay" onclick="fecharPopup()">
  <div id="popup-box" onclick="event.stopPropagation()">
    <span class="icon" id="popup-icon"></span>
    <h3 id="popup-titulo"></h3>
    <p id="popup-msg"></p>
    <button id="popup-close" onclick="fecharPopup()">Entendi</button>
  </div>
</div>

<script>
function mostrarPopup(tipo, titulo, msg){
  const box = document.getElementById('popup-box');
  box.className = tipo;
  document.getElementById('popup-icon').innerText = tipo==='erro' ? '⛔' : '✅';
  document.getElementById('popup-titulo').innerText = titulo;
  document.getElementById('popup-msg').innerText = msg;
  document.getElementById('overlay').style.display='flex';
}
function fecharPopup(){ document.getElementById('overlay').style.display='none'; }
const nivel = () => document.getElementById('nivelAcesso').value;

async function carregarVendas(){
  try{
    const r = await fetch('/api/relatorio-vendas');
    const dados = await r.json();
    document.querySelector('#tabelaVendas tbody').innerHTML = dados.map(v=>`
      <tr><td>#${v.id_pedido}</td><td><b>${v.nome_cliente}</b></td><td>R$ ${Number(v.total_pedido).toFixed(2)}</td><td><span class="status ${v.status_pedido}">${v.status_pedido}</span></td></tr>
    `).join('');
  }catch(e){ document.querySelector('#tabelaVendas tbody').innerHTML='<tr><td colspan=4>Erro ao carregar vendas</td></tr>'; }
}

async function carregarEstoque(){
  try{
    const r = await fetch('/api/estoque');
    const dados = await r.json();
    document.querySelector('#tabelaEstoque tbody').innerHTML = dados.map(i=>`
      <tr>
        <td><b>${i.nome_produto}</b></td>
        <td><input id="est-${i.id_produto}" type="number" value="${i.estoque_atual}"></td>
        <td>${i.total_unidades_vendidas} und</td>
        <td><button class="btn btn-primary" onclick="alterarEstoque('${i.id_produto}')">Salvar</button></td>
      </tr>
    `).join('');
  }catch(e){ document.querySelector('#tabelaEstoque tbody').innerHTML='<tr><td colspan=4>Erro ao carregar estoque</td></tr>'; }
}

async function alterarEstoque(id){
  const novo = document.getElementById(`est-${id}`).value;
  const res = await fetch(`/api/produtos/${id}`,{
    method:'PUT',
    headers:{'Content-Type':'application/json','user-level':nivel()},
    body:JSON.stringify({novoEstoque:parseInt(novo)})
  });
  const data = await res.json();
  if(res.ok){
    mostrarPopup('sucesso','Gerente Atualizou!','Estoque alterado para '+novo+' unidades. Alteração registrada no sistema.');
    carregarEstoque();
  } else {
    mostrarPopup('erro','Clientes Não Podem Atualizar', data.erro);
  }
}

carregarVendas(); carregarEstoque();
</script>
</body>
</html>
