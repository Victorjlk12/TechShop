<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechShop • Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0f; --card:#12141d; --card2:#1a1d29; --border:#232735; --blue:#5b5bff; --green:#00df81; --red:#ff4d5a; --text:#f5f5f7; --muted:#8a8fa3;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif;}
body{background:var(--bg); color:var(--text); min-height:100vh;}
body::before{content:''; position:fixed; inset:0; background:radial-gradient(600px at 0% 0%, rgba(91,91,255,.15), transparent), radial-gradient(800px at 100% 100%, rgba(0,223,129,.1), transparent); pointer-events:none;}
header{padding:28px 40px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); background:rgba(8,10,15,.8); backdrop-filter:blur(20px); position:sticky; top:0; z-index:10;}
.logo{font-size:22px; font-weight:700;} .logo span{color:var(--blue);}
.pill{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); padding:8px 8px 8px 16px; border-radius:999px;}
.pill select{background:var(--card2); border:1px solid var(--border); color:white; padding:8px 14px; border-radius:999px; outline:none;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green);}
main{padding:32px 40px; max-width:1300px; margin:0 auto;}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:32px;}
.stat{background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--border); border-radius:20px; padding:22px;}
.stat small{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1.2px;}
.stat h3{font-size:32px; margin:8px 0;}
.stat .mono{font-family:'JetBrains Mono'; color:var(--muted); font-size:12px;}
.section{background:var(--card); border:1px solid var(--border); border-radius:24px; overflow:hidden; margin-bottom:24px;}
.section-head{padding:22px 26px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border);}
table{width:100%; border-collapse:collapse;}
th{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; padding:14px 26px; text-align:left;}
td{padding:16px 26px; font-size:14px; border-top:1px solid #1a1e2b;}
tr:hover{background:#151822;}
.badge{padding:5px 12px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid;}
.badge.ok{background:rgba(0,223,129,.1); color:var(--green); border-color:rgba(0,223,129,.2);}
.badge.warn{background:rgba(255,211,0,.1); color:#ffd300; border-color:rgba(255,211,0,.2);}
.input-wrap{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:6px 10px; width:110px;}
.input-wrap input{background:transparent; border:none; color:white; width:100%; outline:none; font-family:'JetBrains Mono'; text-align:center;}
.btn-save{background:white; color:black; border:none; padding:8px 16px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;}
.btn-del{background:var(--red); color:white; border:none; padding:8px 16px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;}
#overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(16px); display:none; align-items:center; justify-content:center; z-index:100;}
#overlay.show{display:flex;}
#modal{width:92%; max-width:420px; background:linear-gradient(180deg,#1e2130,#141620); border:1px solid #2a2e40; border-radius:28px; padding:32px; text-align:center;}
#modal.erro{border-color:rgba(255,77,90,.3); box-shadow:0 20px 80px rgba(255,77,90,.2);}
#modal.sucesso{border-color:rgba(0,223,129,.3); box-shadow:0 20px 80px rgba(0,223,129,.15);}
.icon-box{width:72px; height:72px; border-radius:20px; display:grid; place-items:center; font-size:34px; margin:0 auto 18px;}
.erro .icon-box{background:#3f151a; border:1px solid #ef4444; color:#ff4d5a;}
.sucesso .icon-box{background:#0a2e22; border:1px solid #10b981; color:var(--green);}
#modal button{width:100%; padding:14px; border-radius:14px; border:none; font-weight:700; cursor:pointer; background:white; color:black; margin-top:16px;}
.mono{font-family:'JetBrains Mono', monospace;}
</style>
</head>
<body>
<header>
  <div class="logo">TECHSHOP<span>.OS</span></div>
  <div class="pill"><div class="dot"></div><span style="font-size:13px; color:var(--muted)">Modo:</span>
    <select id="nivelAcesso"><option value="Client">Cliente — View Only</option><option value="Admin">Admin — Full Access</option></select>
  </div>
</header>
<main>
  <div class="grid">
    <div class="stat"><small>Total Produtos</small><h3 id="stat-total">4</h3><div class="mono">INVENTORY • LIVE</div></div>
    <div class="stat"><small>Estoque Crítico</small><h3 id="stat-low" style="color:var(--red)">1</h3><div class="mono">ALERT • &lt; 10 UN</div></div>
    <div class="stat"><small>Faturamento</small><h3 id="stat-fat">R$ 7.650</h3><div class="mono">SALES • BRL</div></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>◍ Vendas Recentes</h2><span class="mono" style="color:var(--muted); font-size:11px;">/api/relatorio-vendas</span></div>
    <table id="tabelaVendas"><thead><tr><th>PEDIDO</th><th>CLIENTE</th><th>TOTAL</th><th>STATUS</th><th style="text-align:right">AÇÃO</th></tr></thead><tbody id="bodyVendas"></tbody></table>
  </div>

  <div class="section">
    <div class="section-head"><h2>◍ Controle de Estoque</h2><span class="mono" style="color:var(--muted); font-size:11px;">RESTRICTED • ADMIN ONLY</span></div>
    <table id="tabelaEstoque"><thead><tr><th>PRODUTO</th><th>ESTOQUE</th><th>VENDIDO</th><th style="text-align:right">AÇÃO</th></tr></thead><tbody id="bodyEstoque"></tbody></table>
  </div>
</main>

<div id="overlay" onclick="fechar()"><div id="modal" onclick="event.stopPropagation()"><div class="icon-box" id="m-icon"></div><h3 id="m-title"></h3><p id="m-msg" style="color:var(--muted); font-size:14px; line-height:1.6;"></p><button onclick="fechar()">Continuar →</button></div></div>

<script>
const vendasFixas = [
  { id_pedido: 1, nome_cliente: 'Ana Silva', total_pedido: 4800, status_pedido: 'Concluído' },
  { id_pedido: 2, nome_cliente: 'Bruno Costa', total_pedido: 2500, status_pedido: 'Concluído' },
  { id_pedido: 3, nome_cliente: 'Carlos Souza', total_pedido: 350, status_pedido: 'Pendente' },
];
const estoqueFixo = [
  { id_produto: '65a1b2c3d4e5f6a7b8c9d0e1', nome_produto: 'Notebook Gamer', estoque_atual: 10, total_unidades_vendidas: 12 },
  { id_produto: '65a1b2c3d4e5f6a7b8c9d0e2', nome_produto: 'Smartphone 5G', estoque_atual: 25, total_unidades_vendidas: 30 },
  { id_produto: '65a1b2c3d4e5f6a7b8c9d0e3', nome_produto: 'Mouse Sem Fio', estoque_atual: 50, total_unidades_vendidas: 80 },
  { id_produto: '65a1b2c3d4e5f6a7b8c9d0e4', nome_produto: 'Teclado Mecânico', estoque_atual: 0, total_unidades_vendidas: 5 },
];

function render(vendas, estoque){
  document.getElementById('bodyVendas').innerHTML = vendas.map(v=>`
    <tr><td class="mono">#${String(v.id_pedido).padStart(4,'0')}</td><td><b>${v.nome_cliente}</b></td><td class="mono">R$ ${Number(v.total_pedido).toFixed(2)}</td><td><span class="badge ${v.status_pedido==='Concluído'?'ok':'warn'}">${v.status_pedido}</span></td><td style="text-align:right"><button class="btn-del" onclick="delPedido('${v.id_pedido}')">Excluir</button></td></tr>
  `).join('');
  document.getElementById('bodyEstoque').innerHTML = estoque.map(i=>`
    <tr><td><div style="font-weight:600">${i.nome_produto}</div><div class="mono" style="font-size:11px; color:#8a8fa3">${String(i.id_produto).slice(-6).toUpperCase()}</div></td><td><div class="input-wrap"><input id="est-${i.id_produto}" type="number" value="${i.estoque_atual}"></div></td><td class="mono">${i.total_unidades_vendidas} un</td><td style="text-align:right"><button class="btn-save" onclick="save('${i.id_produto}')">Salvar</button></td></tr>
  `).join('');
  document.getElementById('stat-total').innerText = estoque.length;
  document.getElementById('stat-low').innerText = estoque.filter(x=>x.estoque_atual<10).length;
  document.getElementById('stat-fat').innerText = 'R$ '+vendas.reduce((a,b)=>a+(b.total_pedido||0),0).toLocaleString('pt-BR');
  window._vendas = vendas; window._estoque = estoque;
}

render(vendasFixas, estoqueFixo);
fetch('/api/relatorio-vendas').then(r=>r.json()).then(v=>{ if(v.length>0) render(v, window._estoque); }).catch(()=>{});
fetch('/api/estoque').then(r=>r.json()).then(e=>{ if(e.length>0) render(window._vendas, e); }).catch(()=>{});

function popup(tipo,titulo,msg){
  const modal=document.getElementById('modal'); modal.className=tipo;
  document.getElementById('m-icon').innerText=tipo==='erro'?'⛔':'✦';
  document.getElementById('m-title').innerText=titulo;
  document.getElementById('m-msg').innerText=msg;
  document.getElementById('overlay').classList.add('show');
}
function fechar(){ document.getElementById('overlay').classList.remove('show'); }

async function save(id){
  const val = document.getElementById(`est-${id}`).value;
  const nivel = document.getElementById('nivelAcesso').value;
  try{
    const res = await fetch(`/api/produtos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','user-level':nivel},body:JSON.stringify({novoEstoque:parseInt(val)})});
    const data = await res.json();
    if(res.ok) popup('sucesso','Estoque Atualizado','Estoque alterado para '+val+' unidades. Sincronizado com Atlas!');
    else popup('erro','Acesso Negado', data.erro);
  }catch{ 
    if(nivel!=='Admin') popup('erro','Acesso Negado','Acesso negado. Apenas Administradores podem alterar dados.');
    else popup('sucesso','Estoque Atualizado','Modo demo: estoque alterado para '+val+' unidades!');
  }
}

async function delPedido(id){
  const nivel = document.getElementById('nivelAcesso').value;
  if(nivel !== 'Admin'){
    popup('erro','Acesso Negado','Apenas Administradores podem excluir pedidos. Troque para Admin no topo.');
    return;
  }
  if(!confirm('Tem certeza que quer excluir o pedido #'+id+'?')) return;
  try{
    const res = await fetch(`/api/pedidos/${id}`,{method:'DELETE',headers:{'user-level':nivel}});
    const data = await res.json();
    if(res.ok){
      popup('sucesso','Pedido Excluído','Pedido #'+id+' removido com sucesso!');
      render(window._vendas.filter(v=>String(v.id_pedido)!==String(id)), window._estoque);
    }else popup('erro','Acesso Negado', data.erro);
  }catch{
    popup('sucesso','Pedido Excluído','Modo demo: pedido #'+id+' removido!');
    render(window._vendas.filter(v=>String(v.id_pedido)!==String(id)), window._estoque);
  }
}
</script>
</body>
</html>
